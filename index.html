<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>지명 낙하 — 한국 행정구역 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root{
    --night:#0f1b2d; --deep:#16263f; --sea:#1f3a5c;
    --land:#ead9ae; --land-hover:#ffc94d; --land-done:#a8b3a0;
    --ink:#233048; --paper:#fffaf0;
    --yellow:#ffd60a; --green:#3ddc84; --red:#ff4d5a; --sky:#7cc4ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--night);color:var(--paper);
    font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
  .disp{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
  button{font-family:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 22px;font-size:18px;
    background:var(--yellow);color:var(--ink);font-weight:700;transition:transform .1s,filter .1s}
  button:active{transform:scale(.96)}
  button.ghost{background:transparent;color:var(--paper);border:2px solid rgba(255,255,255,.35)}
  button.small{padding:8px 14px;font-size:14px;border-radius:10px}
  button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  input{font-family:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);color:var(--paper);width:100%;text-align:center;letter-spacing:.1em}
  input:focus{outline:none;border-color:var(--yellow)}
  select{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:12px;background:#1f3a5c;color:var(--paper);
    border:1px solid rgba(255,255,255,.25);max-width:100%}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto;
    background:radial-gradient(circle at 50% 0%,var(--sea) 0%,var(--night) 70%)}
  .screen.on{display:flex}
  .card{width:min(430px,100%);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:11px;text-align:center;backdrop-filter:blur(6px);margin:auto}
  h1.title{font-size:clamp(36px,9vw,60px);line-height:1;color:var(--yellow);letter-spacing:-.02em;text-shadow:0 6px 0 rgba(0,0,0,.35)}
  h1.title small{display:block;font-size:.36em;color:var(--sky);letter-spacing:.2em;margin-top:8px}
  .sub{color:rgba(255,255,255,.7);font-size:14px;line-height:1.5}
  .lab{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.5)}
  .row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
  .err{color:var(--red);font-size:14px;min-height:1.4em}
  .seg button.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}

  /* ---- game ---- */
  #game{display:none;position:fixed;inset:0;flex-direction:column;background:linear-gradient(180deg,var(--deep),var(--night))}
  #game.on{display:flex}
  #hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;
    background:rgba(0,0,0,.35);border-bottom:1px solid rgba(255,255,255,.1);flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;line-height:1}
  .stat b{font-size:22px;color:var(--yellow)}
  .stat span{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.12em}
  #lives{font-size:22px;letter-spacing:2px}
  #lives .x{opacity:.2;filter:grayscale(1)}
  #stage b{color:var(--sky)}
  #timer b{color:var(--red)}
  #play{position:relative;flex:1;overflow:hidden}
  #map{position:absolute;inset:0;background:var(--deep)}
  .leaflet-container{background:var(--deep);font-family:inherit}
  .leaflet-interactive{cursor:pointer;transition:fill .15s}
  .lbl{background:transparent;border:0;box-shadow:none;pointer-events:none;padding:0;overflow:visible}
  .lbl span{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:'Noto Sans KR',sans-serif;
    font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;
    text-shadow:0 0 3px #fffaf0,0 0 3px #fffaf0,0 0 3px #fffaf0}
  .lbl.hide{display:none}
  .lbl.done span{color:#556}
  #play>.word,#play>.pop,#play>.particle,#play>#combo,#play>#lb,#play>#banner,#play>#floor,#play>#scopeTag{z-index:1000}
  #scopeTag{position:absolute;left:8px;top:8px;font-size:12px;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:999px;pointer-events:none}
  .word{position:absolute;left:0;top:0;padding:8px 16px;border-radius:999px;background:var(--yellow);color:var(--ink);
    font-family:'Jua',sans-serif;font-size:clamp(19px,4.4vw,27px);white-space:nowrap;pointer-events:none;
    box-shadow:0 8px 0 rgba(0,0,0,.3),0 0 24px rgba(255,214,10,.45);will-change:transform}
  .word.fall{animation:wob 1.2s ease-in-out infinite}
  .word .tag{display:inline-block;font-size:.5em;padding:2px 7px;border-radius:999px;margin-right:6px;vertical-align:middle;
    color:#fff;font-family:'Noto Sans KR',sans-serif;font-weight:700}
  .tag.do{background:#2a9d5c} .tag.si{background:#2f6fde} .tag.gun{background:#8a6d2f} .tag.gu{background:#8d3fa8}
  .word.si{background:#bfe0ff;box-shadow:0 8px 0 rgba(0,0,0,.3),0 0 24px rgba(124,196,255,.5)}
  .word.gun{background:#ffe2a8} .word.gu{background:#eccaff}
  @keyframes wob{0%,100%{rotate:-3deg}50%{rotate:3deg}}
  #floor{position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,transparent 14px 24px);opacity:.7}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,2px)}40%{transform:translate(8px,-2px)}60%{transform:translate(-6px,0)}80%{transform:translate(6px,0)}}
  .pop{position:absolute;pointer-events:none;font-family:'Jua',sans-serif;font-size:32px;color:var(--green);
    text-shadow:0 3px 0 rgba(0,0,0,.5);animation:pop 1s ease-out forwards;transform:translate(-50%,-50%)}
  .pop.bad{color:var(--red)}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
  #combo{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:'Jua',sans-serif;font-size:30px;
    color:#fff;opacity:0;pointer-events:none;text-shadow:0 0 20px var(--yellow),0 4px 0 rgba(0,0,0,.5)}
  #combo.show{animation:combo .9s ease-out}
  @keyframes combo{0%{opacity:0;transform:translateX(-50%) scale(.4)}30%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
  .particle{position:absolute;width:10px;height:10px;border-radius:3px;pointer-events:none;animation:fly .8s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
  #banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
  #banner.on{display:flex}
  #banner div{font-family:'Jua',sans-serif;font-size:clamp(34px,9vw,66px);color:var(--yellow);text-shadow:0 8px 0 rgba(0,0,0,.5);
    animation:bannerIn 1.6s ease-out forwards;text-align:center;line-height:1.1}
  #banner div small{display:block;font-size:.4em;color:var(--sky)}
  @keyframes bannerIn{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.1)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
  #lb{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.5);border-radius:12px;padding:8px 10px;font-size:12px;min-width:120px;display:none;pointer-events:none}
  #lb.on{display:block}
  #lb div{display:flex;justify-content:space-between;gap:8px}
  #lb div.me{color:var(--yellow);font-weight:700}

  .score-big{font-size:64px;color:var(--yellow);line-height:1}
  #teacher .card{width:min(760px,100%)}
  .code{font-size:clamp(44px,13vw,88px);letter-spacing:.18em;color:var(--yellow);line-height:1;text-shadow:0 8px 0 rgba(0,0,0,.4)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1)}
  th{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.15em}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.top td:first-child::before{content:"🥇 "} tr.second td:first-child::before{content:"🥈 "} tr.third td:first-child::before{content:"🥉 "}
  .bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green);transition:width .4s}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:170px;margin:10px 0}
  .podium div{flex:1;max-width:120px;background:linear-gradient(180deg,var(--yellow),#d9a400);border-radius:10px 10px 0 0;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 4px;font-weight:700;animation:rise 1s ease-out}
  .podium div:nth-child(1){height:70%;background:linear-gradient(180deg,#dfe3ea,#9aa3b0)} .podium div:nth-child(2){height:100%} .podium div:nth-child(3){height:50%;background:linear-gradient(180deg,#e0b08a,#a86f40)}
  @keyframes rise{from{height:0}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
  @media (max-width:480px){#hud{padding:6px 8px}.stat b{font-size:18px}#lives{font-size:18px}button{padding:12px 16px;font-size:16px}}
</style>
</head>
<body>

<section id="menu" class="screen on">
  <div class="card">
    <h1 class="title disp">지명 낙하<small>한국 행정구역</small></h1>
    <p class="sub">지명이 하늘에서 떨어져요. 바닥에 닿기 전에<br>지도에서 그 지역을 눌러 잡으세요!</p>
    <p class="lab">백지도 범위</p>
    <select id="soloScope"></select>
    <p class="sub" id="soloScopeInfo"></p>
    <button id="btnSolo">혼자 연습하기</button>
    <button id="btnJoin" class="ghost">참가 코드로 대결하기</button>
    <button id="btnTeacher" class="ghost">교사 모드 (대결 중계)</button>
    <p class="sub">단계가 오를수록 지도의 이름표가 사라지고 속도가 빨라져요.</p>
  </div>
</section>

<section id="join" class="screen">
  <div class="card">
    <h2 class="disp" style="font-size:32px;color:var(--yellow)">대결 참가</h2>
    <input id="joinCode" placeholder="참가 코드 4자리" maxlength="4" autocapitalize="characters" autocomplete="off">
    <input id="joinName" placeholder="내 이름" maxlength="10" style="letter-spacing:0">
    <div class="err" id="joinErr"></div>
    <button id="btnConnect">입장하기</button>
    <button class="ghost back">뒤로</button>
  </div>
</section>

<section id="wait" class="screen">
  <div class="card">
    <h2 class="disp" style="font-size:28px;color:var(--green)">입장 완료!</h2>
    <p class="sub">선생님이 시작 버튼을 누르면 바로 시작돼요.<br>화면을 끄지 마세요.</p>
    <div id="waitList" class="sub" style="font-size:16px;color:var(--paper)"></div>
    <div class="disp" style="font-size:40px;animation:wob 1s infinite">⏳</div>
  </div>
</section>

<section id="teacher" class="screen" style="justify-content:flex-start">
  <div class="card">
    <p class="lab">참가 코드</p>
    <div class="code disp" id="roomCode">····</div>
    <div class="err" id="teacherErr"></div>
    <div class="row">
      <label class="sub">백지도 범위 <select id="tScope"></select></label>
      <label class="sub">대결 방식
        <select id="rule">
          <option value="score">점수 대결</option>
          <option value="survival">서바이벌</option>
          <option value="race">완주 레이스</option>
        </select></label>
      <label class="sub" id="durWrap">제한 시간
        <select id="duration"><option value="60">60초</option><option value="90">90초</option><option value="120" selected>120초</option><option value="180">180초</option></select></label>
    </div>
    <p class="sub" id="ruleDesc"></p>
    <div class="row">
      <button id="btnStart" disabled>대결 시작</button>
      <button id="btnEnd" class="ghost" disabled>종료</button>
    </div>
    <div class="row sub"><span id="tCount">참가자 0명</span> · <span id="tTimer"></span></div>
    <div id="podium" class="podium" style="display:none"></div>
    <table><thead><tr><th>이름</th><th>최근</th><th>연속</th><th>목숨</th><th class="n" id="thScore">점수</th></tr></thead><tbody id="tBody"></tbody></table>
    <button class="ghost back small" style="align-self:center">메뉴로</button>
  </div>
</section>

<section id="game">
  <div id="hud">
    <div class="stat"><b id="score">0</b><span>SCORE</span></div>
    <div class="stat" id="stage"><b id="stageN">1단계</b><span>STAGE</span></div>
    <div class="stat" id="timer" style="display:none"><b id="timeLeft">120</b><span>TIME</span></div>
    <div class="stat"><b id="left">0</b><span>남은 지역</span></div>
    <div id="lives">❤️❤️❤️</div>
    <button id="btnMute" class="small ghost" aria-label="소리 끄기">🔊</button>
  </div>
  <div id="play">
    <div id="map" aria-label="백지도"></div>
    <div id="scopeTag"></div>
    <div id="floor"></div>
    <div id="combo"></div>
    <div id="lb"></div>
    <div id="banner"><div></div></div>
  </div>
</section>

<section id="result" class="screen">
  <div class="card">
    <h2 class="disp" id="resTitle" style="font-size:36px;color:var(--red)">게임 오버</h2>
    <div class="score-big disp" id="resScore">0</div>
    <p class="sub" id="resDetail"></p>
    <div id="resRank"></div>
    <button id="btnAgain">다시 하기</button>
    <button class="ghost back">메뉴로</button>
  </div>
</section>

// 전국 모드: 광역시·도 16 (광주+전남 통합)
const NATION = [
  {id:'sl',codes:['11']},{id:'bs',codes:['21']},{id:'dg',codes:['22']},{id:'ic',codes:['23']},
  {id:'dj',codes:['25']},{id:'us',codes:['26']},{id:'sj',codes:['29']},{id:'gg',codes:['31']},
  {id:'gw',codes:['32']},{id:'cb',codes:['33']},{id:'cn',codes:['34']},{id:'jb',codes:['35']},
  {id:'gj',codes:['36','24'],name:'광주·전남',short:'광주·전남',type:'do'},
  {id:'gb',codes:['37']},{id:'gn',codes:['38']},{id:'jj',codes:['39']},
];
const SCOPES = [{v:'nation',t:'전국 — 광역시·도 16'}].concat(
  Object.keys(SIDO).filter(c=>c!=='29').sort().map(c=>({v:c,t:SIDO[c][0]+' 백지도'})));
const scopeName = s => s==='nation' ? '전국 광역시·도' : SIDO[s][0];

function toFeature(o,props){ return {type:'Feature',properties:props,geometry:{type:o.t==='MP'?'MultiPolygon':'Polygon',coordinates:o.c}}; }
const muniOf = code => DATA.muni.filter(m=>m.p[0]===code);
function unitCount(scope){ return scope==='nation' ? NATION.length : muniOf(scope).length; }
function tagOf(name){ return name.endsWith('군')?'gun':name.endsWith('구')?'gu':name.endsWith('시')?'si':'do'; }
function tagText(t,name){ return t==='gun'?'군':t==='gu'?'구':t==='si'?(name.includes('특별')?'특별시':name.includes('광역')?'광역시':'시'):'도'; }

/* 범위에 맞는 유닛 목록 만들기 */
function buildUnits(scope){
  if(scope==='nation'){
    return NATION.map(n=>{
      const s=SIDO[n.codes[0]];
      const parts=n.codes.map(c=>DATA.sido.find(f=>f.p[0]===c));
      return {id:n.id,name:n.name||s[0],short:n.short||s[1],type:n.type||s[2],
        features:parts.map(p=>toFeature(p,{})),label:parts[0].l};
    });
  }
  return muniOf(scope).map(m=>({id:scope+m.p[1],name:m.p[1],short:m.p[1],type:tagOf(m.p[1]),
    features:[toFeature(m,{})],label:m.l}));
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const randCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');

/* ================= 사운드 ================= */
const Snd = {
  ctx:null, muted:false, playing:false, tempo:132, nextT:0, step:0, timer:null, gain:null,
  init(){ if(this.ctx) return; this.ctx=new (window.AudioContext||window.webkitAudioContext)(); this.gain=this.ctx.createGain(); this.gain.gain.value=.35; this.gain.connect(this.ctx.destination); },
  tone(f,t,dur,type='square',vol=.25){ if(this.muted) return; const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=type;o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g);g.connect(this.gain); o.start(t);o.stop(t+dur+.02); },
  noise(t,dur,vol=.15){ if(this.muted) return; const b=this.ctx.createBuffer(1,Math.max(1,this.ctx.sampleRate*dur),this.ctx.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; const s=this.ctx.createBufferSource(),g=this.ctx.createGain(),f=this.ctx.createBiquadFilter(); f.type='highpass';f.frequency.value=6000; s.buffer=b; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); s.connect(f);f.connect(g);g.connect(this.gain); s.start(t); },
  kick(t){ if(this.muted) return; const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12); g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25); o.connect(g);g.connect(this.gain);o.start(t);o.stop(t+.3); },
  bass:[55,55,65.4,55,73.4,55,65.4,49],
  arp:[220,261.6,329.6,440,392,329.6,261.6,220,246.9,293.7,349.2,493.9,440,349.2,293.7,246.9],
  schedule(){ if(!this.playing) return; const beat=60/this.tempo, sx=beat/4;
    while(this.nextT<this.ctx.currentTime+.15){ const s=this.step;
      if(s%4===0) this.kick(this.nextT);
      if(s%2===1) this.noise(this.nextT,.04,.08);
      if(s%4===2) this.noise(this.nextT,.1,.12);
      this.tone(this.bass[Math.floor(s/2)%8],this.nextT,sx*1.8,'sawtooth',.18);
      this.tone(this.arp[s%16]*(s%32<16?1:1.5),this.nextT,sx*.9,'square',.06);
      this.nextT+=sx; this.step++; }
    this.timer=setTimeout(()=>this.schedule(),50); },
  start(tempo){ this.init(); if(this.ctx.state==='suspended') this.ctx.resume(); this.tempo=tempo||132; if(this.playing) return; this.playing=true; this.nextT=this.ctx.currentTime+.05; this.step=0; this.schedule(); },
  stop(){ this.playing=false; clearTimeout(this.timer); },
  sfxOk(c){ if(!this.ctx) return; const t=this.ctx.currentTime; [523,659,784,1046].forEach((f,i)=>this.tone(f*(1+Math.min(c,8)*.03),t+i*.06,.18,'triangle',.3)); },
  sfxNg(){ if(!this.ctx) return; const t=this.ctx.currentTime; this.tone(160,t,.25,'sawtooth',.3); this.tone(120,t+.1,.3,'sawtooth',.3); },
  sfxLife(){ if(!this.ctx) return; const t=this.ctx.currentTime; [440,370,311,262].forEach((f,i)=>this.tone(f,t+i*.12,.25,'square',.25)); },
  sfxClear(){ if(!this.ctx) return; const t=this.ctx.currentTime; [523,659,784,1046,1318].forEach((f,i)=>this.tone(f,t+i*.1,.5,'triangle',.3)); },
};
$('#btnMute').onclick=()=>{ Snd.muted=!Snd.muted; $('#btnMute').textContent=Snd.muted?'🔇':'🔊'; };

/* ================= 지도 ================= */
const STYLE={base:{fillColor:'#ead9ae',fillOpacity:1,color:'#16263f',weight:1.3},
  hover:{fillColor:'#ffc94d'},done:{fillColor:'#a8b3a0'},ok:{fillColor:'#3ddc84'},ng:{fillColor:'#ff4d5a'}};
const map=L.map('map',{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,
  boxZoom:false,keyboard:false,attributionControl:false,tap:false,zoomSnap:.1});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:14,opacity:.45}).addTo(map);
L.control.attribution({prefix:false,position:'bottomleft'}).addAttribution('© OpenStreetMap © CARTO').addTo(map);
let drawn=L.layerGroup().addTo(map), UNITS=[], allBounds=null;

function drawScope(scope){
  drawn.clearLayers(); UNITS=buildUnits(scope); allBounds=null;
  UNITS.forEach(u=>{
    u.done=false; u.busy=false; u.layers=[];
    u.features.forEach(f=>{
      const layer=L.geoJSON(f,{style:STYLE.base}).getLayers()[0];
      layer.on('mouseover',()=>{ if(!u.done&&!u.busy) u.setStyle(STYLE.hover); });
      layer.on('mouseout',()=>{ if(!u.done&&!u.busy) u.setStyle(STYLE.base); });
      layer.on('click',()=>Game.click(u));
      drawn.addLayer(layer); u.layers.push(layer);
      allBounds = allBounds ? allBounds.extend(layer.getBounds()) : L.latLngBounds(layer.getBounds());
    });
    u.center=L.latLng(u.label);
    u.marker=L.marker(u.center,{interactive:false,icon:L.divIcon({className:'lbl',html:'<span>'+u.short+'</span>',iconSize:[0,0],iconAnchor:[0,0]})});
    drawn.addLayer(u.marker);
    Object.defineProperty(u,'txt',{get(){return u.marker.getElement();},configurable:true});
    u.setStyle=s=>u.layers.forEach(l=>l.setStyle(s));
    u.flash=(s,after,ms)=>{ u.busy=true; u.setStyle(s); setTimeout(()=>{u.setStyle(after);u.busy=false;},ms); };
  });
  fitScope();
}
function fitScope(){ if(allBounds) map.fitBounds(allBounds,{padding:[10,10]}); }
window.addEventListener('resize',()=>{ map.invalidateSize(); fitScope(); });
function centerXY(u){ const p=map.latLngToContainerPoint(u.center); return [p.x,p.y]; }

const Game = {
  mode:'solo', scope:'nation', rule:'score', score:0, lives:3, round:1, combo:0, correct:0,
  pool:[], cur:null, raf:null, t0:0, dur:0, over:false, rng:Math.random,
  timeLimit:0, timeLeft:0, timerInt:null, startAt:0,
  fallTime(){ return Math.max(3.5, 8 - (this.round-1)*1.2) * 1000; },
  labelRatio(){ return [1,.6,.3,0][Math.min(this.round-1,3)]; },
  start(mode,opt={}){
    const {seed=null,timeLimit=0,scope='nation',rule='score'}=opt;
    this.mode=mode; this.scope=scope; this.rule=rule; this.startAt=performance.now();
    this.score=0; this.lives=3; this.round=1; this.combo=0; this.correct=0; this.over=false;
    this.rng = seed!=null ? mulberry32(seed) : Math.random;
    this.timeLimit = rule==='score' ? (timeLimit||0) : 0; this.timeLeft=this.timeLimit;
    $('#timer').style.display = this.timeLimit?'':'none';
    $('#timeLeft').textContent = this.timeLimit;
    $('#lb').classList.toggle('on', mode==='battle');
    $('#scopeTag').textContent = scopeName(scope)+' 백지도';
    show('#game'); drawScope(scope); setTimeout(()=>{map.invalidateSize();fitScope();},60);
    this.newRound(true); this.hud(); Snd.start(132);
    clearInterval(this.timerInt);
    if(this.timeLimit) this.timerInt=setInterval(()=>{ this.timeLeft--; $('#timeLeft').textContent=this.timeLeft; if(this.timeLeft<=0) this.end('time'); },1000);
  },
  newRound(first){
    if(!first){ this.round++; Snd.sfxClear(); Snd.tempo=132+this.round*10;
      this.banner(this.round+'단계!','이름표 '+Math.round(this.labelRatio()*100)+'% · 더 빨라져요'); }
    else this.banner(scopeName(this.scope),UNITS.length+'개 지역 · 이름표 모두 보임');
    this.pool=UNITS.slice(); this.shuffle(this.pool);
    UNITS.forEach(u=>{ u.done=false; u.setStyle(STYLE.base); u.txt.classList.remove('done'); });
    const n=Math.round(UNITS.length*this.labelRatio()); const shown=UNITS.slice(); this.shuffle(shown);
    const vis=new Set(shown.slice(0,n).map(u=>u.id));
    UNITS.forEach(u=>u.txt.classList.toggle('hide',!vis.has(u.id)));
    this.hud(); setTimeout(()=>this.spawn(), first?1000:1500);
  },
  shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(this.rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];} },
  spawn(){
    if(this.over) return;
    if(this.pool.length===0){ if(this.rule==='race'&&this.mode==='battle'){ this.end('race'); return; } this.newRound(false); return; }
    const u=this.pool[0], el=document.createElement('div');
    el.className='word fall '+u.type;
    el.innerHTML=`<span class="tag ${u.type}">${tagText(u.type,u.name)}</span>${u.name}`;
    $('#play').appendChild(el);
    const pw=$('#play').clientWidth;
    el.style.left=Math.round(10+this.rng()*Math.max(10,pw-el.offsetWidth-20))+'px';
    this.cur={u,el}; this.t0=performance.now(); this.dur=this.fallTime();
    cancelAnimationFrame(this.raf);
    const step=now=>{ if(!this.cur||this.cur.el!==el) return;
      const p=Math.min(1,(now-this.t0)/this.dur), h=$('#play').clientHeight-el.offsetHeight-8;
      el.style.transform=`translateY(${p*h}px)`;
      if(p>=1){ this.miss(); return; } this.raf=requestAnimationFrame(step); };
    this.raf=requestAnimationFrame(step);
  },
  progress(){ return Math.min(1,(performance.now()-this.t0)/this.dur); },
  click(u){
    if(this.over||!this.cur||u.done) return; Snd.init();
    const [x,y]=centerXY(u);
    if(u===this.cur.u){
      const speed=Math.round(200*(1-this.progress()));
      const base=this.mode==='battle'?100+speed:100+Math.round(speed/2);
      this.combo++; const gain=Math.round(base*(1+Math.min(this.combo,10)*.1));
      this.score+=gain; this.correct++;
      u.done=true; u.flash(STYLE.ok,STYLE.done,600); u.txt.classList.remove('hide'); u.txt.classList.add('done');
      this.pool.shift(); this.cur.el.remove(); this.cur=null;
      this.pop('+'+gain,x,y,false); this.burst(x,y); Snd.sfxOk(this.combo);
      if(this.combo>=2){ const c=$('#combo'); c.textContent=this.combo+' COMBO!'+(this.combo>=5?' 🔥':''); c.classList.remove('show'); void c.offsetWidth; c.classList.add('show'); }
      this.hud(); this.report(u.short,true); setTimeout(()=>this.spawn(),450);
    } else {
      this.combo=0; u.flash(STYLE.ng,STYLE.base,500);
      this.pop('✗',x,y,true); Snd.sfxNg();
      $('#play').classList.remove('shake'); void $('#play').offsetWidth; $('#play').classList.add('shake');
      this.hud(); this.report(u.short,false);
    }
  },
  miss(){
    if(!this.cur) return; const {el,u}=this.cur; this.cur=null; this.combo=0;
    el.classList.remove('fall'); el.style.background='var(--red)'; el.style.color='#fff'; setTimeout(()=>el.remove(),500);
    this.lives--; Snd.sfxLife();
    $('#play').classList.remove('shake'); void $('#play').offsetWidth; $('#play').classList.add('shake');
    this.pool.push(this.pool.shift());
    this.hud(); this.report(u.short+' 놓침',false);
    if(this.lives<=0){ this.end('lives'); return; }
    setTimeout(()=>this.spawn(),700);
  },
  hud(){ $('#score').textContent=this.score; $('#stageN').textContent=this.round+'단계';
    $('#left').textContent=this.pool.length;
    $('#lives').innerHTML=[0,1,2].map(i=>`<span class="${i<this.lives?'':'x'}">❤️</span>`).join(''); },
  pop(t,x,y,bad){ const d=document.createElement('div'); d.className='pop'+(bad?' bad':''); d.textContent=t; d.style.left=x+'px'; d.style.top=y+'px'; $('#play').appendChild(d); setTimeout(()=>d.remove(),1000); },
  burst(x,y){ const cs=['#ffd60a','#3ddc84','#7cc4ff','#ff7ab6','#fff'];
    for(let i=0;i<18;i++){ const p=document.createElement('i'); p.className='particle';
      const a=Math.random()*Math.PI*2,d=60+Math.random()*90;
      p.style.cssText=`left:${x}px;top:${y}px;background:${cs[i%5]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px`;
      $('#play').appendChild(p); setTimeout(()=>p.remove(),800); } },
  banner(t,s){ const b=$('#banner'); b.firstElementChild.innerHTML=t+(s?`<small>${s}</small>`:'');
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); setTimeout(()=>b.classList.remove('on'),1700); },
  elapsed(){ return Math.round((performance.now()-this.startAt)/100)/10; },
  report(last,ok){ if(this.mode==='battle') Net.send({t:'score',score:this.score,lives:this.lives,combo:this.combo,last,ok,round:this.round,correct:this.correct,elapsed:this.elapsed()}); },
  end(reason){
    if(this.over) return; this.over=true; cancelAnimationFrame(this.raf); clearInterval(this.timerInt); Snd.stop();
    if(this.cur){ this.cur.el.remove(); this.cur=null; }
    document.querySelectorAll('.word').forEach(e=>e.remove());
    $('#resTitle').textContent = reason==='lives'?'게임 오버':reason==='time'?'시간 종료!':reason==='race'?'완주! '+this.elapsed()+'초':'대결 종료';
    $('#resTitle').style.color = reason==='lives'?'var(--red)':'var(--green)';
    $('#resScore').textContent=this.score;
    $('#resDetail').textContent=`${scopeName(this.scope)} · ${this.round}단계 도달 · 정답 ${this.correct}개`;
    $('#resRank').innerHTML=''; $('#btnAgain').style.display=this.mode==='battle'?'none':'';
    if(this.mode==='battle'){ Net.send({t:'done',score:this.score,correct:this.correct,elapsed:this.elapsed(),finished:reason==='race'});
      $('#resRank').innerHTML='<p class="sub">선생님 화면에서 순위를 확인하세요.</p>'; }
    setTimeout(()=>show('#result'), reason==='force'?0:900);
  },
};

/* ================= 네트워크 ================= */
const Net = {
  peer:null, conn:null, players:new Map(), lbTimer:null, code:'', tTimer:null, tLeft:0, rule:'score', finishCount:0,
  ready(){ return typeof Peer!=='undefined'; },
  join(code,name){
    if(!this.ready()) return $('#joinErr').textContent='통신 모듈을 불러오지 못했어요. 인터넷 연결을 확인하세요.';
    $('#joinErr').textContent='연결 중…';
    this.peer=new Peer();
    this.peer.on('error',e=>{ $('#joinErr').textContent = e.type==='peer-unavailable'?'그 코드의 방을 찾을 수 없어요.':'연결 오류: '+e.type; });
    this.peer.on('open',()=>{
      this.conn=this.peer.connect('kgeo-'+code,{reliable:true});
      this.conn.on('open',()=>{ this.send({t:'join',name}); show('#wait'); });
      this.conn.on('data',d=>this.onStudent(d));
      this.conn.on('close',()=>{ if(!Game.over&&$('#game').classList.contains('on')) Game.end('force'); });
    });
  },
  send(d){ if(this.conn&&this.conn.open) this.conn.send(d); },
  onStudent(d){
    if(d.t==='players') $('#waitList').textContent='참가자: '+d.list.join(', ');
    if(d.t==='start') Game.start('battle',{seed:d.seed,timeLimit:d.duration,scope:d.scope,rule:d.rule});
    if(d.t==='lb') $('#lb').innerHTML=d.list.slice(0,6).map((p,i)=>`<div class="${p.me===this.peer.id?'me':''}"><span>${i+1}. ${p.name}</span><b>${p.disp}</b></div>`).join('');
    if(d.t==='end'){ Game.end('force'); const me=d.list.findIndex(p=>p.me===this.peer.id);
      $('#resRank').innerHTML=`<div class="disp" style="font-size:28px;color:var(--yellow)">${me>=0?(me+1)+'등!':''}</div>`+
        d.list.slice(0,5).map((p,i)=>`<div class="sub">${i+1}. ${p.name} — ${p.disp}</div>`).join(''); }
  },
  host(){
    if(!this.ready()) return $('#teacherErr').textContent='통신 모듈을 불러오지 못했어요. 인터넷 연결을 확인하세요.';
    this.players.clear(); this.code=randCode(); $('#roomCode').textContent='연결 중'; $('#teacherErr').textContent='';
    $('#podium').style.display='none'; $('#tBody').innerHTML=''; $('#btnStart').disabled=true; $('#btnEnd').disabled=true;
    this.peer=new Peer('kgeo-'+this.code);
    this.peer.on('open',()=>{ $('#roomCode').textContent=this.code; });
    this.peer.on('error',e=>{ if(e.type==='unavailable-id') this.host(); else $('#teacherErr').textContent='연결 오류: '+e.type; });
    this.peer.on('connection',c=>{
      c.on('data',d=>{
        if(d.t==='join'){ this.players.set(c.peer,{conn:c,name:d.name,score:0,lives:3,combo:0,last:'',ok:null,done:false,correct:0,elapsed:0,finished:false,rank:0}); this.broadcastPlayers(); this.renderTable(); }
        const p=this.players.get(c.peer); if(!p) return;
        if(d.t==='score'){ Object.assign(p,{score:d.score,lives:d.lives,combo:d.combo,last:d.last,ok:d.ok,round:d.round,correct:d.correct,elapsed:d.elapsed}); this.renderTable(); this.queueLb(); }
        if(d.t==='done'){ Object.assign(p,{done:true,score:d.score,correct:d.correct,elapsed:d.elapsed,finished:d.finished});
          if(p.finished&&!p.rank) p.rank=++this.finishCount;
          this.renderTable(); this.queueLb();
          if(this.players.size&&[...this.players.values()].every(x=>x.done)) this.endBattle(); }
      });
      c.on('close',()=>{ const p=this.players.get(c.peer); if(p){p.done=true;p.last='퇴장';} this.renderTable(); this.broadcastPlayers(); });
    });
  },
  bcast(d){ this.players.forEach(p=>{ if(p.conn.open) p.conn.send(d); }); },
  broadcastPlayers(){ this.bcast({t:'players',list:[...this.players.values()].map(p=>p.name)}); $('#tCount').textContent='참가자 '+this.players.size+'명'; $('#btnStart').disabled=this.players.size===0; },
  disp(p){ return this.rule==='race' ? (p.finished?p.elapsed+'초':'정답 '+(p.correct||0)+(p.done?' (탈락)':''))
    : this.rule==='survival' ? (p.score+'점'+(p.done?' ✝':' ❤'+p.lives)) : p.score+'점'; },
  cmp(a,b){
    if(this.rule==='race'){ if(a.finished!==b.finished) return a.finished?-1:1; if(a.finished) return a.elapsed-b.elapsed; return (b.correct||0)-(a.correct||0); }
    if(this.rule==='survival'){ if(a.done!==b.done) return a.done?1:-1; return b.score-a.score; }
    return b.score-a.score; },
  ranked(){ return [...this.players.entries()].map(([id,p])=>({me:id,name:p.name,score:p.score,disp:this.disp(p),_p:p}))
    .sort((a,b)=>this.cmp(a._p,b._p)).map(({_p,...x})=>x); },
  queueLb(){ if(this.lbTimer) return; this.lbTimer=setTimeout(()=>{ this.lbTimer=null; this.bcast({t:'lb',list:this.ranked()}); },700); },
  startBattle(){
    const duration=+$('#duration').value, rule=$('#rule').value, scope=$('#tScope').value, seed=Math.floor(Math.random()*1e9);
    this.rule=rule; this.finishCount=0;
    this.players.forEach(p=>Object.assign(p,{score:0,lives:3,combo:0,last:'',ok:null,done:false,correct:0,elapsed:0,finished:false,rank:0}));
    this.bcast({t:'start',seed,duration,rule,scope});
    $('#btnStart').disabled=true; $('#btnEnd').disabled=false; $('#podium').style.display='none';
    clearInterval(this.tTimer); this.tLeft=0;
    if(rule==='score'){ this.tLeft=duration; $('#tTimer').textContent='남은 시간 '+duration+'초';
      this.tTimer=setInterval(()=>{ this.tLeft--; $('#tTimer').textContent='남은 시간 '+this.tLeft+'초'; if(this.tLeft<=0) this.endBattle(); },1000); }
    else { $('#tTimer').textContent='진행 중'; this.tTimer=setInterval(()=>{ this.tLeft++; $('#tTimer').textContent='진행 '+this.tLeft+'초'; },1000); }
    this.renderTable();
  },
  endBattle(){
    clearInterval(this.tTimer); $('#tTimer').textContent='종료';
    const list=this.ranked(); this.bcast({t:'end',list});
    $('#btnEnd').disabled=true; $('#btnStart').disabled=this.players.size===0;
    const o=[list[1],list[0],list[2]];
    $('#podium').innerHTML=o.map(p=>p?`<div>${p.name}<small>${p.disp}</small></div>`:'<div style="visibility:hidden"></div>').join('');
    $('#podium').style.display='flex'; this.renderTable();
  },
  renderTable(){
    const key=p=>this.rule==='race'?(p.correct||0):p.score;
    const max=Math.max(1,...[...this.players.values()].map(key));
    const arr=[...this.players.values()].sort((a,b)=>this.cmp(a,b));
    $('#thScore').textContent=this.rule==='race'?'기록':'점수';
    $('#tBody').innerHTML=arr.map((p,i)=>`<tr class="${['top','second','third'][i]||''}">
      <td>${p.name}${p.rank?` <small style="color:var(--yellow)">${p.rank}위 완주</small>`:p.done?' <small style="opacity:.6">(종료)</small>':''}
        <div class="bar"><i style="width:${key(p)/max*100}%"></i></div></td>
      <td style="color:${p.ok===true?'var(--green)':p.ok===false?'var(--red)':'inherit'}">${p.last||'—'}</td>
      <td>${p.combo?p.combo+'🔥':''}</td><td>${'❤️'.repeat(Math.max(0,p.lives))}</td>
      <td class="n"><b>${this.disp(p)}</b></td></tr>`).join('');
  },
};

/* ================= UI ================= */
const opts=SCOPES.map(s=>`<option value="${s.v}">${s.t}</option>`).join('');
$('#soloScope').innerHTML=opts; $('#tScope').innerHTML=opts;
const scopeInfo=()=>{ const v=$('#soloScope').value; $('#soloScopeInfo').textContent=`${scopeName(v)} · ${unitCount(v)}개 지역`; };
$('#soloScope').onchange=scopeInfo; scopeInfo();

const RULE_DESC={score:'제한 시간 안에 점수를 가장 많이 얻는 사람이 이겨요. 빨리 누를수록 보너스!',
  survival:'시간 제한 없이 계속 떨어져요. 목숨 3개가 다 닳으면 탈락, 점수 순으로 순위를 매겨요.',
  race:'범위를 한 바퀴 먼저 다 맞힌 사람이 이겨요. 완주 시간으로 순위를 매겨요.'};
const syncRule=()=>{ $('#ruleDesc').textContent=RULE_DESC[$('#rule').value]; $('#durWrap').style.display=$('#rule').value==='score'?'':'none'; };
$('#rule').onchange=syncRule; syncRule();

$('#btnSolo').onclick=()=>{ Snd.init(); Game.start('solo',{scope:$('#soloScope').value}); };
$('#btnAgain').onclick=()=>{ Snd.init(); Game.start('solo',{scope:Game.scope}); };
$('#btnJoin').onclick=()=>{ $('#joinErr').textContent=''; show('#join'); };
$('#btnConnect').onclick=()=>{ const c=$('#joinCode').value.trim().toUpperCase(), n=$('#joinName').value.trim();
  if(c.length!==4) return $('#joinErr').textContent='참가 코드 4자리를 입력하세요.';
  if(!n) return $('#joinErr').textContent='이름을 입력하세요.';
  Snd.init(); Net.join(c,n); };
$('#btnTeacher').onclick=()=>{ show('#teacher'); Net.host(); };
$('#btnStart').onclick=()=>Net.startBattle();
$('#btnEnd').onclick=()=>Net.endBattle();
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{ Snd.stop(); if(Net.peer){Net.peer.destroy();Net.peer=null;} show('#menu'); });
document.addEventListener('visibilitychange',()=>{ if(!Snd.ctx) return; document.hidden?Snd.ctx.suspend():Snd.ctx.resume(); });
</script>
